plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Deliberately NO fabric-api dependency. The spike polls input from a
    // MinecraftClient#tick mixin instead of using the key-binding API, which
    // keeps the dependency surface to loader + yarn only. One less version to
    // pin against 1.16.1, and one less jar to sideload onto the device.
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Amethyst runs 1.16.1 under Java 17, so target 17 rather than the Java 8 a
// 1.16.1 mod would normally use.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}
