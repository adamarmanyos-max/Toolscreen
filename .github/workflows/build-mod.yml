name: Build mod

# Builds the Route C Fabric mod and publishes the jar as a downloadable
# artifact. GitHub's runners can reach maven.fabricmc.net and Mojang's hosts,
# so this is where the mod actually gets compiled — and where the yarn mapping
# names get verified.
on:
  push:
    paths:
      - 'spike-fabric-mod/**'
      - '.github/workflows/build-mod.yml'
  pull_request:
    paths:
      - 'spike-fabric-mod/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build
        working-directory: spike-fabric-mod
        run: ./gradlew build --stacktrace --no-daemon

      # Temporary diagnostic: find which method actually contains the
      # RenderSystem.viewport call, by disassembling rather than guessing.
      - name: Locate viewport call
        if: always()
        working-directory: spike-fabric-mod
        run: |
          set -eu
          for jar in $(find ~/.gradle/caches -name "*.jar" 2>/dev/null | grep -i minecraft | head -20); do
            if javap -p -cp "$jar" net.minecraft.client.gl.Framebuffer >/dev/null 2>&1; then
              javap -c -p -cp "$jar" net.minecraft.client.gl.Framebuffer > /tmp/fb.txt
              echo "=== method boundaries and viewport calls ==="
              grep -nE "^  [a-z].*\(|viewport|glViewport" /tmp/fb.txt
              exit 0
            fi
          done
          echo "jar not found"

      # Uploaded even on failure: a failed run still tells us which yarn names
      # were wrong, which is the whole point of this workflow right now.
      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolscreen-mobile
          path: spike-fabric-mod/build/libs/*.jar
          if-no-files-found: warn
