name: Build mod

# Builds the Route C Fabric mod and publishes the jar as a downloadable
# artifact. GitHub's runners can reach maven.fabricmc.net and Mojang's hosts,
# so this is where the mod actually gets compiled — and where the yarn mapping
# names get verified.
on:
  push:
    paths:
      - 'spike-fabric-mod/**'
      - '.github/workflows/build-mod.yml'
  pull_request:
    paths:
      - 'spike-fabric-mod/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build
        working-directory: spike-fabric-mod
        run: ./gradlew build --stacktrace --no-daemon

      # Temporary diagnostic: the Mixin annotation processor only warns when it
      # cannot map a method selector, so a wrong signature compiles fine and
      # fails at runtime. Print the real ones from the remapped jar.
      - name: Dump Framebuffer signatures
        if: always()
        working-directory: spike-fabric-mod
        run: |
          set -eux
          for jar in $(find ~/.gradle/caches -name "*.jar" 2>/dev/null | grep -iE "minecraft.*(named|mapped)" | head -20); do
            if javap -p -cp "$jar" net.minecraft.client.gl.Framebuffer >/dev/null 2>&1; then
              echo "=== FOUND IN: $jar ==="
              javap -p -cp "$jar" net.minecraft.client.gl.Framebuffer
              echo "=== RenderSystem.viewport ==="
              javap -p -cp "$jar" com.mojang.blaze3d.systems.RenderSystem 2>/dev/null | grep -i viewport || true
              exit 0
            fi
          done
          echo "NOT FOUND — candidate jars:"
          find ~/.gradle/caches -name "*.jar" 2>/dev/null | grep -i minecraft | head -30

      # Uploaded even on failure: a failed run still tells us which yarn names
      # were wrong, which is the whole point of this workflow right now.
      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolscreen-mobile
          path: spike-fabric-mod/build/libs/*.jar
          if-no-files-found: warn
