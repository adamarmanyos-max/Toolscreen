name: Build mod

# Builds the Route C Fabric mod and publishes the jar as a downloadable
# artifact. GitHub's runners can reach maven.fabricmc.net and Mojang's hosts,
# so this is where the mod actually gets compiled — and where the yarn mapping
# names get verified.
on:
  push:
    paths:
      - 'spike-fabric-mod/**'
      - '.github/workflows/build-mod.yml'
  pull_request:
    paths:
      - 'spike-fabric-mod/**'
  workflow_dispatch:
    inputs:
      classes:
        description: "Space-separated fully-qualified classes to dump signatures for"
        required: false
        type: string
      filter:
        description: "Optional regex to keep only matching signature lines"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build
        working-directory: spike-fabric-mod
        run: ./gradlew build --stacktrace --no-daemon

      # Signature dump. The Mixin annotation processor only warns on selectors
      # it cannot map, so a wrong target compiles cleanly and fails at runtime.
      # Reading the real signatures out of the remapped jar is the only way to
      # be sure before shipping a mixin to a device.
      - name: Dump signatures
        if: github.event_name == 'workflow_dispatch'
        working-directory: spike-fabric-mod
        env:
          CLASSES: ${{ inputs.classes }}
          FILTER: ${{ inputs.filter }}
        run: |
          set -eu
          LIST="${CLASSES:-}"
          if [ -z "$LIST" ]; then
            LIST="net.minecraft.client.gui.hud.InGameHud net.minecraft.client.gui.DrawableHelper net.minecraft.client.font.TextRenderer net.minecraft.client.util.Window"
          fi
          JAR=""
          for jar in $(find ~/.gradle/caches -name "*.jar" 2>/dev/null | grep -i minecraft | head -20); do
            if javap -p -cp "$jar" net.minecraft.client.util.Window >/dev/null 2>&1; then JAR="$jar"; break; fi
          done
          if [ -z "$JAR" ]; then echo "remapped jar not found"; exit 1; fi
          echo "JAR: $JAR"
          for c in $LIST; do
            echo ""
            echo "================ $c ================"
            javap -p -cp "$JAR" "$c" 2>&1 | grep -E "${FILTER:-.}" | head -250
          done

      # Uploaded even on failure: a failed run still tells us which yarn names
      # were wrong, which is the whole point of this workflow right now.
      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolscreen-mobile
          path: spike-fabric-mod/build/libs/*.jar
          if-no-files-found: warn
